name: Secret defaults

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-defaults:
    name: no literal default for a secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/secret_default_check.py

  gateway-startup:
    name: the gateway refuses to start without JWT_SECRET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/api-gateway
      - name: startup test (a run that executes no test fails)
        working-directory: services/api-gateway
        run: |
          out=$(cargo test --test startup 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          passed=$(awk '/^test result:/ {n += $4} END {print n + 0}' <<<"$out")
          [ "$passed" -gt 0 ] || { echo "::error::no test ran"; exit 1; }
